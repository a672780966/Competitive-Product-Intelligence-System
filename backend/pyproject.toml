# see: https://python-poetry.org/docs/pyproject/

[build-system]
requires = ["poetry-core>=1.9"]
build-backend = "poetry.core.masonry.api"

[project]
name = "cpis-v1"
version = "0.1.0"
description = "Competitive Product Intelligence System V1 — 竞品公开信息自动采集与分析系统"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "CPIS Team" }]

dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "sqlalchemy>=2,<3",
    "alembic>=1.13,<2",
    "asyncpg>=0.30,<1",
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5,<6",
    "trafilatura>=1.8,<2",
    "playwright>=1.48,<2",
    "celery>=5.4,<6",
    "redis>=5,<6",
    "structlog>=24.4,<25",
    "python-multipart>=0.0,<1",
    "tenacity>=9,<10",
    "greenlet>=3,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=5,<6",
    "ruff>=0.7,<1",
    "mypy>=1.12,<2",
    "pre-commit>=4,<5",
]

[tool.ruff]
target-version = "py312"
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ARG", "PTH", "ERA", "PD", "PL"]
ignore = ["E501"]  # line-length handled by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
